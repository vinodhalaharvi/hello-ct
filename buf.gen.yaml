version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/example/hello-ct/gen/go
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate

plugins:
  # Go backend
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-category
    out: gen/go
    opt: paths=source_relative

  # TypeScript frontend
  - remote: buf.build/bufbuild/es:v1.10.0
    out: gen/ts
    opt: target=ts
  - remote: buf.build/connectrpc/es:v1.6.1
    out: gen/ts
    opt: target=ts

inputs:
  - directory: proto